# Stage 2 v6: as warmfix, with the backbone (layers 0-9) frozen. If the instability is
# the pretrained features being wrecked early, freezing them should give a flat curve;
# if it also caps accuracy, unfreeze later for a short low-lr finish.

model: yolo11n.pt
data: datasets/varroa_mite/data.yaml
project: runs/mite
name: yolo11n_320_official_warmfix_freeze

imgsz: 320
epochs: 60
batch: 64
patience: 30
optimizer: AdamW
lr0: 0.001
lrf: 0.05
weight_decay: 0.0005
cos_lr: true
warmup_epochs: 2
warmup_bias_lr: 0.001
warmup_momentum: 0.8
freeze: 10
close_mosaic: 0
seed: 0
deterministic: true
workers: 8
plots: true

fliplr: 0.5
flipud: 0.5
degrees: 15.0
scale: 0.2
translate: 0.1
hsv_h: 0.015
hsv_s: 0.5
hsv_v: 0.4
mosaic: 0.0
mixup: 0.0
erasing: 0.0
