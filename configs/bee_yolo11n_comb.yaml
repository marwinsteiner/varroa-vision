# Stage 1 v2: bee detector trained on BEEHIVE (frame + bottom) plus the Hofer comb
# photos, validated and tested on the Hofer comb photos only, which are the closest
# public match to a phone pointed at a comb.

model: yolo11n.pt
data: datasets/bees_comb/data.yaml
project: runs/bee
name: yolo11n_640_comb

imgsz: 640
epochs: 60
batch: 32
patience: 20
optimizer: auto
lr0: 0.01
cos_lr: true
warmup_epochs: 3
close_mosaic: 10
seed: 0
deterministic: true
workers: 8
plots: true

fliplr: 0.5
flipud: 0.5
degrees: 20.0
scale: 0.5
translate: 0.1
hsv_h: 0.015
hsv_s: 0.6
hsv_v: 0.5
mosaic: 1.0
mixup: 0.0
erasing: 0.0
