# Stage 2 v3: no mosaic, 416 px input. Letterboxing 160x280 to 416 upsamples 1.49x, so a
# 32 px mite becomes ~48 px, which suits the P3 stride-8 head better. Costs ~1.7x the
# compute of 320 px; on a phone that is still cheap for a single bee crop.

model: yolo11n.pt
data: datasets/varroa_mite/data.yaml
project: runs/mite
name: yolo11n_416_official_nomosaic

imgsz: 416
epochs: 60
batch: 64
patience: 25
optimizer: auto
lr0: 0.01
cos_lr: true
warmup_epochs: 3
close_mosaic: 0
seed: 0
deterministic: true
workers: 8
plots: true

fliplr: 0.5
flipud: 0.5
degrees: 15.0
scale: 0.2
translate: 0.1
hsv_h: 0.015
hsv_s: 0.5
hsv_v: 0.4
mosaic: 0.0
mixup: 0.0
erasing: 0.0
